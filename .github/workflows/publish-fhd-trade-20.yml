name: Recover FHD_Trade 2.0 original sources
on:
  push:
    paths:
      - '.github/workflows/publish-fhd-trade-20.yml'
      - '1FHD_Trade_v2.0_Nexus-GitHub/tools/nexus_source_export.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git clone --depth=1 https://github.com/Xenomorphchyma/SRHD-XenoModKit.git /tmp/SRHD-XenoModKit
      - name: Verify ZIP and export original source
        env:
          PYTHONPATH: /tmp/SRHD-XenoModKit:1FHD_Trade_v2.0_Nexus-GitHub/tools
        run: |
          python '1FHD_Trade_v2.0_Nexus-GitHub/tools/nexus_source_export.py' --archive '1FHD_Trade_v2.0_Nexus-GitHub/install/FHD_Trade-v2.0.rar' --target '1FHD_Trade_v2.0_Nexus-GitHub' --sha256 61584d90b959b35a341279ae353538cf82e72b66fdfaeb6af62a6a47e9b35217 --mod 'FHD_Trade'
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '1FHD_Trade_v2.0_Nexus-GitHub/SOURCE' '1FHD_Trade_v2.0_Nexus-GitHub/VALIDATION_REPORT.json'
          if ! git diff --cached --quiet; then
            git commit -m 'Extract FHD_Trade 2.0 original source'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
